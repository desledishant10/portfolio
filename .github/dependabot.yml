version: 2
updates:
  # Application dependencies (npm)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # Bundle only minor/patch bumps into the grouped PRs so a single group PR
    # always installs cleanly. Major bumps are raised as individual PRs for
    # deliberate, one-at-a-time review (a major mixed into a group can make the
    # whole group un-installable, e.g. TS 7 vs typescript-eslint's peer range).
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Held back until a deliberate migration: typescript-eslint does not yet
      # support TypeScript 7. (Tailwind was migrated to v4, so 4.x flows normally.)
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # GitHub Actions used by the CI workflow
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"
