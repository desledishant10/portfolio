name: Refresh TryHackMe stats

# Scrapes the live TryHackMe badge with a headless browser and commits the
# numbers to public/thm-stats.json. The committed file is what the Hero card
# renders, so a commit here triggers a normal Vercel redeploy with fresh stats.
#
# Cadence: once a day. Change the cron below to go more/less often. A commit only
# happens when a stat actually changed, so quiet days produce no commit/redeploy.

on:
  schedule:
    - cron: '0 13 * * *' # daily, ~13:00 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: thm-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright + Chromium (isolated from app deps)
        run: |
          # The scraper only needs Playwright, not the app's dependencies - and the
          # committed package-lock.json is out of sync, so `npm ci` fails. Install
          # Playwright by itself into node_modules using a throwaway package.json,
          # then restore the real one before the commit step.
          cp package.json .pkg.bak
          node -e "require('fs').writeFileSync('package.json', JSON.stringify({name:'thm-pw-runner',version:'0.0.0',private:true},null,2))"
          npm install playwright@1 --no-package-lock --no-audit --no-fund
          npx playwright install --with-deps chromium
          mv .pkg.bak package.json

      - name: Scrape TryHackMe stats
        run: npm run thm:refresh

      - name: Commit if changed
        run: |
          if git diff --quiet -- public/thm-stats.json; then
            echo "No stat changes; nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/thm-stats.json
            git commit -m "chore: refresh TryHackMe stats [skip ci]"
            git push
          fi
