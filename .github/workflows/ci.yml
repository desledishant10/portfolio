name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dash lint
        run: npm run lint:dashes

      - name: Type-check and build
        run: npm run build

      - name: ESLint
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
