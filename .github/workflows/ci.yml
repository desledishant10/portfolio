name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Prefer strict, reproducible `npm ci`. Fall back to `npm install` when
        # the lockfile is missing a platform's optional native deps: npm prunes
        # the wasm-fallback subtree (@emnapi/*, @napi-rs/wasm-runtime) from the
        # lock when it is regenerated on macOS, which Linux `npm ci` then rejects
        # (npm/cli optional-deps bug). Dependabot's Linux-generated locks still
        # take the strict path.
        run: npm ci || npm install --no-audit --no-fund

      - name: Dash lint
        run: npm run lint:dashes

      - name: Type-check and build
        run: npm run build

      - name: ESLint
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
